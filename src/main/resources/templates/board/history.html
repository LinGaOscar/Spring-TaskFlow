<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-TW">
<head>
  <meta charset="UTF-8"><title>歷史看板</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    .board-card { position:relative; opacity:0.85; }
    .board-card a { text-decoration:none; color:inherit; display:block; }
    .archived-badge { font-size:0.72rem; background:#dfe6e9; color:#636e72; border-radius:10px; padding:2px 8px; margin-left:0.5rem; vertical-align:middle; }
    .restore-btn { position:absolute; top:0.6rem; right:0.6rem; padding:0.2rem 0.5rem; font-size:0.75rem; opacity:0; transition:opacity 0.15s; }
    .board-card:hover .restore-btn { opacity:1; }
  </style>
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
      <div class="page-header">
        <h2>歷史看板</h2>
      </div>
      <!-- 查詢列：GET 重載本頁，過濾由後端 BoardService.searchHistory 執行（含部門隔離） -->
      <form class="page-header" method="get" th:action="@{/boards/history}">
          <div style="display:flex; gap:0.5rem; align-items:center;">
              <input type="text" name="keyword" th:value="${keyword}" placeholder="搜尋看板名稱"
                     style="padding:0.45rem 0.8rem; border:1px solid #b2bec3; border-radius:4px;">
              <input type="date" name="from" th:value="${from}"
                     style="padding:0.4rem; border:1px solid #b2bec3; border-radius:4px;">
              <span>～</span>
              <input type="date" name="to" th:value="${to}"
                     style="padding:0.4rem; border:1px solid #b2bec3; border-radius:4px;">
              <button type="submit" class="btn btn-primary btn-sm">查詢</button>
          </div>
      </form>
      <!-- 伺服器端渲染：boards 已由 Controller 依 keyword/from/to 過濾完成 -->
      <div class="board-grid" th:if="${!boards.isEmpty()}">
        <div class="board-card" th:each="b : ${boards}">
          <a th:href="@{/boards/{id}(id=${b.id})}">
            <div class="board-card-name">
              <span th:text="${b.name}">看板名稱</span>
              <span class="archived-badge">已歸檔</span>
            </div>
            <div class="board-card-meta">
              <span th:text="'負責人：' + ${b.owner.displayName}">負責人</span>
              <span th:if="${b.department != null}" th:text="'｜' + ${b.department.name}">部門</span>
            </div>
          </a>
          <!-- 還原鈕顯示語意需與後端 checkArchivePermission 對齊：科長可還原本科任一看板；
               Leader 僅限自己負責的看板，比對 ownerId 與目前使用者 id，避免看到點了必失敗的按鈕 -->
          <button sec:authorize="hasRole('SECTION_CHIEF')"
                  class="btn btn-sm restore-btn"
                  th:attr="data-id=${b.id},data-name=${b.name}"
                  onclick="restoreBoard(this)"
                  title="還原為進行中">還原</button>
          <button sec:authorize="hasRole('PROJECT_LEADER')"
                  th:if="${b.owner != null and b.owner.id == currentUserId}"
                  class="btn btn-sm restore-btn"
                  th:attr="data-id=${b.id},data-name=${b.name}"
                  onclick="restoreBoard(this)"
                  title="還原為進行中">還原</button>
        </div>
      </div>
      <p th:if="${boards.isEmpty()}" style="color:#636e72">尚無歷史看板。</p>
    </main>
  </div>
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:inline="javascript">
    const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    const CSRF_TOKEN  = /*[[${_csrf.token}]]*/ '';
    // 還原後重載頁面（保留查詢參數），權限最終仍由後端 unarchiveBoard 驗證
    function restoreBoard(btn) {
      const name = btn.dataset.name;
      if (!confirm(`確定還原「${name}」為進行中看板？`)) return;
      fetch(`/api/boards/${btn.dataset.id}/unarchive`, {
        method: 'POST', headers: { [CSRF_HEADER]: CSRF_TOKEN }
      }).then(r => r.json()).then(d => {
        if (d.success) location.reload();
        else alert(d.message || '還原失敗');
      });
    }
  </script>
</body>
</html>
